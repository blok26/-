# Netlify Configuration for "ارسمها لو تقدر"

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# API endpoints routed to Netlify Serverless Functions
[[redirects]]
  from = "/api/ice-config"
  to = "/.netlify/functions/ice-config"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

# SPA fallback: redirect all unhandled paths to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self)"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
